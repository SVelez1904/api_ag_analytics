#
# CARGO ES EL EQUIVALENTE A: pom.xml de Java 
#

[package]
name = "api_ag_analytics"
version = "0.1.0"
edition = "2024"

[dependencies]
# Framework Web y Runtime Asíncrono
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }

# Serialización y Deserialización a JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Driver de PostgreSQL con soporte asíncrono
sqlx = { version = "0.7", features = [ "postgres", "runtime-tokio-rustls", "macros", "chrono" ] }
# Para manejo de fechas de PostgreSQL
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15.7"
